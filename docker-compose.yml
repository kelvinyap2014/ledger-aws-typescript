services:
  mysql-js:
    image: mysql:8.0
    container_name: ledger_mysql_js
    environment:
      MYSQL_DATABASE: ledger_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    restart: on-failure

  mysql-health-check-js:
    image: mysql:8.0
    container_name: ledger_mysql_health_check_js
    command: mysql -h mysql-js -u root -prootpassword -e "SELECT VERSION();"
    depends_on:
      mysql-js:
        condition: service_healthy
    restart: "no"

  ledger-js:
    build:
      context: ./apps/ledger-js
      dockerfile: Dockerfile
    container_name: ledger_js_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=mysql-js
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=ledger_db
    depends_on:
      mysql-health-check-js:
        condition: service_completed_successfully

volumes:
  mysql_data:
